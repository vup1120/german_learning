name: Build and deploy learning site

on:
  push:
    branches: [main]
  schedule:
    # Every day at 04:30 UTC (early morning in Munich): refresh the news.
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Test speech engine (Node.js)
        run: node --test tests/test_audio_engine.js
      - name: Build site data and fetch news
        run: python tools/build_site.py
      # Requires Settings → Pages → Source: "GitHub Actions". With "Deploy from a branch",
      # GitHub publishes README.md through Jekyll instead of the app in site/.
      # (The workflow token cannot switch that setting itself, so no `enablement` here.)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
